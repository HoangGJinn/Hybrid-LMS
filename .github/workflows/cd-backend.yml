name: CD Backend Deployment

on:
  push:
    branches:
      - master
    paths:
      - 'lms-backend/**'
      - '.github/workflows/cd-backend.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-backend" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./lms-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/hybrid-lms
            
            # Cập nhật image mới nhất từ GHCR
            docker compose pull backend
            
            # Khởi động lại container (chỉ tạo lại khi image thay đổi)
            docker compose up -d backend
            
            # Dọn dẹp các image cũ không còn sử dụng để tránh đầy ổ 30GB
            docker image prune -f
