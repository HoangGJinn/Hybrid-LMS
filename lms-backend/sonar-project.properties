# SonarQube Scanner Config — Backend (NestJS)
# Chạy: xem README hoặc SONAR_SETUP.md ở thư mục gốc

sonar.projectKey=hybrid-lms-backend
sonar.projectName=Hybrid LMS - Backend (NestJS)
sonar.projectVersion=1.0

# Source & Test
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Loại trừ các file không chứa logic nghiệp vụ (sẽ kéo tụt coverage ảo)
sonar.exclusions=\
  **/*.module.ts,\
  **/*.dto.ts,\
  **/*.entity.ts,\
  **/*.d.ts,\
  **/migrations/**,\
  dist/**,\
  node_modules/**

# Coverage — SonarQube đọc file lcov.info do Vitest sinh ra
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json
