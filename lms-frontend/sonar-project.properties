# SonarQube Scanner Config — Frontend (React/Vite)
# Chạy: xem README hoặc SONAR_SETUP.md ở thư mục gốc

sonar.projectKey=hybrid-lms-frontend
sonar.projectName=Hybrid LMS - Frontend (React/Vite)
sonar.projectVersion=1.0

# Source & Test
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Loại trừ các file không chứa logic nghiệp vụ
sonar.exclusions=\
  src/main.tsx,\
  src/router.tsx,\
  src/vite-env.d.ts,\
  src/**/*.d.ts,\
  src/**/*.types.ts,\
  src/test/**,\
  dist/**,\
  node_modules/**

# Coverage — SonarQube đọc file lcov.info do Vitest sinh ra
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json
