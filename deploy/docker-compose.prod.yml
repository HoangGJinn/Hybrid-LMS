# Production Docker Compose for EC2 deployment
# Location on EC2: ~/hybrid-lms/docker-compose.yml
services:
  backend:
    image: ghcr.io/hoanggjinn/hybrid-lms-backend:latest
    container_name: lms-backend
    restart: unless-stopped
    ports:
      - '9595:9595'
    env_file:
      - .env
    environment:
      # Zalo Bot Notification (fill in ~/hybrid-lms/.env or replace defaults after :-)
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN:-}
      ZALO_MODE: ${ZALO_MODE:-polling}
      ZALO_BOT_WEBHOOK_SECRET: ${ZALO_BOT_WEBHOOK_SECRET:-}
      ZALO_DEBUG: ${ZALO_DEBUG:-false}
    volumes:
      - ./ca.pem:/app/ca.pem:ro
      - ./logs:/app/logs
