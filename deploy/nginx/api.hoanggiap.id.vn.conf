# Nginx reverse proxy configuration for Hybrid LMS Backend API
# Target: /etc/nginx/sites-available/api.hoanggiap.id.vn
# Enable SSL via Certbot: sudo certbot --nginx -d api.hoanggiap.id.vn

server {
    listen 80;
    server_name api.hoanggiap.id.vn;

    location / {
        proxy_pass http://127.0.0.1:9595;
        proxy_http_version 1.1;

        # Forward real client information to NestJS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Maximum file upload size and timeouts
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

