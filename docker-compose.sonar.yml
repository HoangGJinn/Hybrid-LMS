version: '3.8'

# SonarQube Local Stack — Hybrid LMS
# Chạy: docker compose -f docker-compose.sonar.yml up -d
# Truy cập: http://localhost:9000 (admin / admin)
# Tắt: docker compose -f docker-compose.sonar.yml down

services:
  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    # SonarQube dùng Elasticsearch ngầm — cần ulimits này trên Linux/WSL
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  sonar-db:
    image: postgres:15-alpine
    container_name: sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar -d sonarqube']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db_data:
